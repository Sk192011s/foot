<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily Football Tips</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #f7f9fb;
    }
    .card {
      border-radius: 16px;
    }
    table {
      font-size: 15px;
    }
    th, td {
      white-space: nowrap; /* Prevent line break in match column */
    }
    td.match {
      min-width: 200px;  /* Expand match column */
    }
    td.date {
      min-width: 110px;  /* Expand date column */
    }
    td.result img {
      height: 30px;
      vertical-align: middle;
    }
    @media (max-width: 768px) {
      table {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4 text-center fw-bold text-primary">Daily Football Tips</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-hover text-center align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Date</th>
                <th>Match</th>
                <th>Tip</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="date">2025-11-10</td>
                <td class="match">Manchester United vs Arsenal</td>
                <td>Over 2.5 Goals</td>
                <td class="result">
                  <!-- Win GIF -->
                  <img src="https://media.giphy.com/media/111ebonMs90YLu/giphy.gif" alt="Win">
                </td>
              </tr>
              <tr>
                <td class="date">2025-11-09</td>
                <td class="match">Barcelona vs Real Madrid</td>
                <td>Both Teams to Score</td>
                <td class="result">
                  <!-- Lost icon -->
                  ❌
                </td>
              </tr>
              <tr>
                <td class="date">2025-11-08</td>
                <td class="match">Juventus vs AC Milan</td>
                <td>Under 2.5 Goals</td>
                <td class="result">
                  <!-- Draw icon -->
                  ⚪
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <p class="text-muted text-center mt-3 small">
      Update this HTML daily by adding new matches to the table.
    </p>
  </div>
</body>
</html>
