<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily Football Tips</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #f7f9fb;
    }
    .card {
      border-radius: 16px;
    }
    table {
      font-size: 15px;
    }

    /* Win / Lost animations */
    .win {
      font-weight: bold;
      color: green;
      font-size: 1.2em;
      animation: pulse 1s infinite;
    }

    .lost {
      font-weight: bold;
      color: red;
      font-size: 1.2em;
      animation: shake 0.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    @media (max-width: 768px) {
      table {
        font-size: 13px;
      }
      .win, .lost {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4 text-center fw-bold text-primary">Daily Football Tips</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-hover text-center align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Date</th>
                <th>Match</th>
                <th>Tip</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>2025-11-10</td>
                <td>Man United vs Arsenal</td>
                <td>Over 2.5 Goals</td>
                <td class="win">WIN</td>
              </tr>
              <tr>
                <td>2025-11-09</td>
                <td>Barcelona vs Real Madrid</td>
                <td>Both Teams to Score</td>
                <td class="lost">LOST</td>
              </tr>
              <tr>
                <td>2025-11-08</td>
                <td>Juventus vs AC Milan</td>
                <td>Under 2.5 Goals</td>
                <td class="win">WIN</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <p class="text-muted text-center mt-3 small">
      Update this HTML daily by adding new matches to the table.
    </p>
  </div>
</body>
</html>
