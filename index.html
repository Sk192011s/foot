<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily Football Tips</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #f7f9fb;
    }
    .card {
      border-radius: 16px;
    }
    table {
      font-size: 13px;
      table-layout: fixed;
      width: 100%;
    }
    th, td {
      padding: 4px 6px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .win {
      font-weight: bold;
      color: orange;
      animation: glow 1.5s infinite alternate;
    }

    .lost {
      font-weight: bold;
      color: red;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 2px currentColor; }
      50% { text-shadow: 0 0 8px currentColor; }
      100% { text-shadow: 0 0 2px currentColor; }
    }

    @media (max-width: 768px) {
      table {
        font-size: 12px;
      }
      th, td {
        padding: 2px 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4 text-center fw-bold text-primary">Daily Football Tips</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-hover text-center align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Date</th>
                <th>Match</th>
                <th>Tip</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>2025-11-10</td>
                <td>Man United vs Arsenal</td>
                <td>Over 2.5 Goals</td>
                <td class="win">WIN</td>
              </tr>
              <tr>
                <td>2025-11-09</td>
                <td>Barcelona vs Real Madrid</td>
                <td>Both Teams to Score</td>
                <td class="lost">LOST</td>
              </tr>
              <tr>
                <td>2025-11-08</td>
                <td>Juventus vs AC Milan</td>
                <td>Under 2.5 Goals</td>
                <td class="win">WIN</td>
              </tr>
              <tr>
                <td>2025-11-08</td>
                <td>Man Utd vs Arsenal</td>
                <td>Arsenal</td>
                <td class="win">WIN</td>
              </tr>
              <tr>
                <td>2025-11-11</td>
                <td>Napoli vs AC Milan</td>
                <td>Napoli -0.5</td>
                <td class="lost">LOST</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
