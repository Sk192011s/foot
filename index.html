<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily Football Tips</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #f7f9fb;
    }
    .card {
      border-radius: 16px;
    }
    table {
      font-size: 15px;
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #dee2e6; /* table border only */
      text-align: center;
      padding: 8px;
      white-space: nowrap;
    }
    thead th {
      background: #343a40; /* dark header */
      color: #fff;
    }
    tbody td {
      background: transparent; /* remove white background */
    }

    /* Win / Lost styles */
    .win {
      font-weight: bold;
      color: var(--win-color, red); /* toggle with CSS variable */
      animation: glow 1.5s infinite alternate;
    }
    .lost {
      font-weight: bold;
      color: black;
      animation: glow 1.5s infinite alternate;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 2px currentColor; }
      50% { text-shadow: 0 0 8px currentColor; }
      100% { text-shadow: 0 0 2px currentColor; }
    }

    /* Match / Date column min-width */
    td.match { min-width: 200px; }
    td.date { min-width: 110px; }

    /* Responsive */
    .table-responsive {
      overflow-x: auto;
    }
    @media (max-width: 768px) {
      table {
        font-size: 13px;
      }
      td.match { min-width: 150px; }
      td.date { min-width: 90px; }
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4 text-center fw-bold text-primary">Daily Football Tips</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Date</th>
                <th>Match</th>
                <th>Tip</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="date">2025-11-10</td>
                <td class="match">Man United vs Arsenal</td>
                <td>Over 2.5 Goals</td>
                <td class="win">WIN</td>
              </tr>
              <tr>
                <td class="date">2025-11-09</td>
                <td class="match">Barcelona vs Real Madrid</td>
                <td>Both Teams to Score</td>
                <td class="lost">LOST</td>
              </tr>
              <tr>
                <td class="date">2025-11-08</td>
                <td class="match">Juventus vs AC Milan</td>
                <td>Under 2.5 Goals</td>
                <td class="win">WIN</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <p class="text-muted text-center mt-3 small">
      Update this HTML daily by adding new matches to the table.
    </p>
  </div>

  <!-- Toggle Win color -->
  <script>
    // Example: change Win color to yellow
    document.documentElement.style.setProperty('--win-color', 'orange'); // 'red' or 'orange' or 'yellow'
  </script>
</body>
</html>
